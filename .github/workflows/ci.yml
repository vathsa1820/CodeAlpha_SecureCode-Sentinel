name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, "step-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          python -m pytest -v

  frontend-build:
    name: Frontend Build & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

  security-static-checks:
    name: Security & Static Code Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Application Code Security Audit
        run: |
          python scripts/security_check.py

      - name: Run Automated Secret Scanning
        run: |
          python scripts/secret_scan.py

      - name: Verify Dockerfile Security Properties
        run: |
          python scripts/verify_docker_security.py

  docker-build:
    name: Docker Analyzer Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Static Analyzer Image
        run: |
          docker build -t securecode-sentinel-analyzer:latest -f docker/Dockerfile .

      - name: Docker Non-Root & Security Smoke Test
        run: |
          echo "[+] Running Docker Container Non-Root Verification..."
          USER_OUT=$(docker run --rm --network=none --read-only --user=10001:10001 securecode-sentinel-analyzer:latest whoami)
          echo "Container User: $USER_OUT"
          if [ "$USER_OUT" != "sentinel" ]; then
            echo "❌ Container did not execute as unprivileged sentinel user!"
            exit 1
          fi
          echo "✅ Docker non-root security smoke test passed!"
